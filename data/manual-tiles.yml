# Manual Tiles Configuration
# User-defined custom tiles that appear alongside auto-generated GitHub project tiles

tiles:
  # Profile tile (spans all columns at top)
  - id: "profile-intro"
    type: "profile"
    title: "Hi, I'm Justin \"Avery\" Chan 👋"
    description: "Welcome to my website, I hope you enjoy it!"
    image: "./assets/images/profile/face.jpg"
    priority: 1000  # Highest priority - always at top
    tags: ["profile"]
    span_all_columns: true
    featured: true

  # Resume link tile
  - id: "resume-tile"
    type: "link"
    title: "View My Résumé"
    description: "Full résumé with experience and education"
    url: "./writing/resume/full.html?from=portfolio"
    open_new_tab: false
    priority: 450
    content_type: "experience"
    content_types: ["experience", "links"]
    tags: ["professional"]
    style:
      border_color: "#6B7280"

  - id: "linked-notes-demo"
    type: "link"
    title: "Notes"
    description: "A connected space for writing that can grow over time."
    url: "./writing/notes/notes.html?from=portfolio"
    open_new_tab: false
    priority: 140
    content_type: "writing"
    tags: ["writing", "design", "prototype"]
    style:
      border_color: "#6B7280"

  - id: "writing-overview"
    type: "link"
    title: "Writing"
    description: "Public writing and connected notes."
    url: "./writing/notes/writing.html?path=writing&open=last&from=portfolio"
    open_new_tab: false
    priority: 500
    content_type: "writing"
    section_header: true
    tags: ["writing"]

  # More projects on GitHub (second-to-last tile)
  - id: "github-more"
    type: "link"
    title: "GitHub"
    description: "More projects on GitHub"
    icon: "fab fa-github"
    url: "https://github.com/Avery2?tab=repositories&type=source"
    open_new_tab: true
    priority: -1
    content_type: "links"
    tags: ["professional", "projects"]

  # Harm Reduction writing
  - id: "harm-reduction"
    type: "link"
    title: "Harm Reduction"
    description: "A philosophy that honors dignity and autonomy."
    url: "./writing/notes/harm-reduction.html?from=portfolio"
    open_new_tab: false
    priority: 110
    content_type: "writing"
    tags: ["philosophy", "writing"]
    style:
      border_color: "#6B7280"

  # LinkedIn profile
  - id: "linkedin-profile"
    type: "link"
    title: "LinkedIn"
    description: "Feel free to say hi"
    icon: "fab fa-linkedin"
    url: "https://www.linkedin.com/in/avery2/"
    open_new_tab: true
    priority: 75
    content_type: "links"
    tags: ["professional", "social"]

  - id: "links-overview"
    type: "link"
    title: "Links"
    description: "Places to find me and my work."
    url: "./writing/notes/find-me.html?path=find-me&open=last&from=portfolio"
    open_new_tab: false
    priority: 500
    content_type: "links"
    section_header: true
    tags: ["links", "professional"]

  - id: "experience-overview"
    type: "link"
    title: "Experience"
    description: "Experience and education."
    url: "./writing/resume.html?path=resume&open=last&from=portfolio"
    open_new_tab: false
    priority: 500
    content_type: "experience"
    section_header: true
    tags: ["experience", "education", "professional"]

  # Appears when the Projects content filter is active. The ordinary homepage
  # already is the curated project view, so this overview need not duplicate it.
  - id: "projects-overview"
    type: "link"
    title: "Projects"
    description: "Browse the project collection."
    url: "./projects/index.html?path=projects&open=last&from=portfolio"
    open_new_tab: false
    priority: 500
    content_type: "projects"
    section_header: true
    tags: ["projects"]

  # Back to Top (absolute last tile)
  - id: "back-to-top"
    type: "link"
    title: "Back to Top"
    description: "Return to the top of the page"
    icon: "fas fa-arrow-up"
    url: "#"
    open_new_tab: false
    priority: -2
    content_type: "navigation"
    tags: ["navigation"]
    style:
      border_color: "#DA7422"

