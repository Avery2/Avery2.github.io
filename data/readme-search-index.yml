  SimpleReadme: 'You can add a README to your GitHub profile to tell other people
    about yourself. ( docs ) SimpleReadme helps you make a simple yet good looking
    README. You can use it online here to generate the text for you. Example Output:
    Hi, I’m Avery 👋 I’m currently a computer science and data science double major
    at the University of Wisconsin-Madison. This summer I am working as a developer
    intern at Halo Science . Example Source: See my profile in this style. Instructions
    (Automatic) Create a repository that is the same as your github username (for
    example: GitHubUser/GitHubUser) Create a README.md in that repository Use the
    autogenerator here to generate the README text. Paste the text into your README
    Done! You can also make any edits you want. Note: If the link to the tool is ever
    down you can still use it by downloading this repo and opening index.html locally.
    Instructions (Manual) Create a repository that is the same as your github username
    (for example: GitHubUser/GitHubUser) Create a README.md in that repository Add
    the following text (in "Raw Text"), and make replacements as described below (in
    "Replacement Instructions") Add your Resume to the respository (optional) Replace
    the bio placeholder Done! It should show up at your profile. Raw Text Replacement
    Instructions Replace the following text. Count included to make sure you get each
    one. Text to replace Count Description FIRST_LAST 3 Your name LINKED_IN_PROFILE_LINK
    1 Link to your LinkedIn profile MY_EMAIL 2 Your email (assumes Gmail extension)
    MY_WEBSITE_URL 3 Your website URL PATH_TO_RESUME 1 The path to your resume file
    (you can add it to this repo) TIME_LAST_UPDATED 1 Last time your Resume was updated.
    (Ex: "Jun 2001") Resources Tools for this README Tool Link Sheilds.io for the
    badges link Other Cool Resources Tool Link Profile-readme for recent activity
    link Github-readme-stats for the GitHub stats summary link Productive-box for
    pinned gist (below) of commit times link List of many tools and examples link'
