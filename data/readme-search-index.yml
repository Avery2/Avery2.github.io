  Antibiotic-Visualization: This is a static visualization that communicates this
    antibiotics data . View the final visualization here . View an incomplete but
    dynamic version here . Technology R for data exploration , data manipulation,
    and variable creation. Tableau for parallel visualization prototyping and then
    heavy lifing of design. Final touches in Figma . Journey I started with just building
    some context for the data. I aimed to visualize "how effective are these antibiotics."
    After a quick google search, I learned a low minimum inhibitory concentration
    (MIC) value means the antibiotic was more effective, and that was enough context
    for the data to get going. I started exploring the data in R. I got a rough summary
    of the data and found I needed to do some data manipulation. I needed to pivot
    the data to facet it by and . Once I got this done and did some fiddling with
    a faceted dot plot, I had a rough idea that I wanted to encode by value faceted
    by . This new graph would aim to communicate which antibiotic was generally more
    effective (across the 16 bacteria). The "faceted dot plot" and first Tableau visual
    After these initial visuals, I noticed that it was still hard to compare the effectiveness
    of each antibiotic. A large part of this is because I had chosen to facet by ,
    it was hard to compare the value for the same across the faceted data. I would
    have the same issue (but worse) if I had faceted instead, so I decided to encode
    this comparison with color. To do this, I went back to R to generate a new variable
    called that encoded an 's performance compared to the others for a given . took
    on a value of with meaning it had the lowest MIC and meaning it had the most MIC.
    Additionally, within each facet, I sorted by which to make it easier to compare
    in aggregate the different facets. After these initial visuals, I noticed that
    it was still hard to compare the effectiveness of each antibiotic. A large part
    of this is because I had chosen to facet by , it was hard to compare the value
