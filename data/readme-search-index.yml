    It removes the distractions like ads, modals, and navigation from vision, letting
    the user just read the content. Learn more about it by watching this video . Premium
    features can be enabled by purchasing Just Read Premium . Please note that this
    extension is meant to format article-type pages only . It is not built to reformat
    other types of websites and is liable to not perform as one might expect. Installation:
    Chrome / Brave / Opera / Edge Firefox Edge You can even use Just Read on your
    smart phone through mobile browsers that support extensions such as Dolphin (iOS
    or Android), Kiwi (Android), or Yandex (iOS or Android). For more information,
    see the mobile installation instructions . Note that some of Just Read''s features
    may not work on mobile devices. The story behind Just Read Hi, I''m Zach. I made
    Just Read because I was tired of terribly hard to read web articles, especially
    news sites. Before I made JR, I would manually use Chrome''s developer tools to
    make a page more readable. Then at the UGA Hacks Fall 2015 hackathon, I decided
    to make a reader mode for Chrome and ended up with the first version of Just Read
    after 16 hours of work. After sharing it on Chrome''s web store, others seemed
    to like it as well, and I''ve been working on it in my free time ever since. Privacy
    statement Just Read collects zero data from users by default. If you sign up for
    an account with Just Read, only your email address is stored. Just Read sends
    analytics to no one else. Any data that Just Read stores is safely secured and
    private. End-user license agreement (EULA) By using Just Read, you are agreeing
    to Just Read''s EULA . FAQ Note: Any time you change something in Just Read''s
    options page, you must restart any Just Read instances for the change to work.
    Using Just Read features How can I start Just Read? On a desktop or laptop Start
    Just Re'
