  Toggl-Analysis: 'I tracked all my worked hours for over a year. This (will be) an
    analysis of that. https://www.averychan.site/Toggl-Analysis/ Places to do more
    I want to try to run a classification algorithm on the times to see if it''s able
    to pick up any patterns in schedules. I eventually want to cross reference with
    other sources of information. I used google calendar daily. I also have an app
    Qbserve that automatically tracks and categorizes computer usage. For personal
    reference, I also have journal entries of varying detail to reference to see what
    effects my productivity or to see what interesting patterns there are. Update
    March 20, 2026 Since we now have the superpowers of AI, I had Claude run on this
    again and it had interesting outputs: Here''s the surprise: your data shows the
    exact opposite of what you expected. The Key Finding You hypothesized negative
    autocorrelation — "work 12 hours, crash the next day." But your data shows strong
    positive autocorrelation : r = +0.37, p < 0.000001. High days are followed by
    high days, and low days are followed by low days. This persists after controlling
    for day-of-week (β = +0.374, p = 0.00007), so it''s not just a weekday/weekend
    artifact. The day-of-week controls barely changed the coefficient at all (0.371
    → 0.374), meaning your weekly schedule isn''t driving this — it''s a real momentum/persistence
    effect. What the Numbers Mean For every extra hour you work today beyond your
    day-of-week average, you tend to work 0.37 more hours tomorrow (not fewer). Your
    work comes in streaks — productive periods cluster together, and low periods cluster
    together. Look at the time series plot: you can see extended runs of high activity
    (especially spring 2020) and extended lulls. Even two days ago predicts today
    (β = 0.16, p = 0.006 in the two-lag model), reinforcing the streak interpretation.
    Why Your Perception Might Differ A few things could explain why you feel a crash
    after a 12-hour day even though the statistics don''t support it: The outlier'
