  xv6_memoryencrypt: 'Memory Encryption in xv6 Project for my OS class 537 (p5). Enables
    memory encryption for the xv6 operating system. Required understanding virtual
    memory, page tables, and trap handlers. Also required modifying page table entries
    and the trap handler that handles page faults. xv6 NOTE: we have stopped maintaining
    the x86 version of xv6, and switched our efforts to the RISC-V version ( https://github.com/mit-pdos/xv6-riscv.git
    ) xv6 is a re-implementation of Dennis Ritchie''s and Ken Thompson''s Unix Version
    6 (v6). xv6 loosely follows the structure and style of v6, but is implemented
    for a modern x86-based multiprocessor using ANSI C. ACKNOWLEDGMENTS xv6 is inspired
    by John Lions''s Commentary on UNIX 6th Edition (Peer to Peer Communications;
    ISBN: 1-57398-013-7; 1st edition (June 14, 2000)). See also https://pdos.csail.mit.edu/6.828/
    , which provides pointers to on-line resources for v6. xv6 borrows code from the
    following sources: JOS (asm.h, elf.h, mmu.h, bootasm.S, ide.c, console.c, and
    others) Plan 9 (entryother.S, mp.h, mp.c, lapic.c) FreeBSD (ioapic.c) NetBSD (console.c)
    The following people have made contributions: Russ Cox (context switching, locking),
    Cliff Frey (MP), Xiao Yu (MP), Nickolai Zeldovich, and Austin Clements. We are
    also grateful for the bug reports and patches contributed by Silas Boyd-Wickizer,
