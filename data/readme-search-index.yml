  PersonalVisualization: 'Work Visualization The data visualized here is my time spent
    doing various things (mostly work) that I collected using Toggl over a year. The
    visuals were created using Observable and d3.js . Data parsing and exploration
    was done in R. For best viewing experience view online here . Source on github
    . Nov 14, 2022 4:20:28 PM TODO: note on how this conditioned me to work Quick
    description The bubble chart kind of looks cool but it honestly doesn''t tell
    me much. The radix chart is the most interesting because it shows cyclical data
    such as extended periods of low or high work. It also shows patterns in the types
    of work done. Note that there were some 30 hour days when I started a timer close
    to midnight. While the radix chart was the most interesting, I found the tree
    map to be most useful. It doesn''t give great insight but it shows the relative
    proportions of each category well as well as giving me an idea of how much work
    one specific task took out of a year of work. Mostly, this informs me on how I
    should label an collect my data going forward. Bubble Chart Year Radix Year Tree
    Map Year'
